# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then switched from
# setup-go to setup-python because this vault's checks are stdlib Python.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint
        run: |
          python3 tools/audit_vault.py --out - --check links && python3 tools/audit_vault.py --out - --check style && python3 tools/audit_pii.py --check

      - name: Test
        run: |
          python3 -m unittest discover tools/tests
