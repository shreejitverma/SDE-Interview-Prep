[package]
name = "rust_abi3_example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.29 is the last PyO3 line with abi3-py38; 0.30 requires CPython 3.9, which would change the wheel tag.
pyo3 = { version = "=0.29.3", features = ["abi3-py38", "extension-module"] }
