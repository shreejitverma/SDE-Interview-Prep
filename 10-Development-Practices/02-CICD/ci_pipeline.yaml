name: C++ and Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install Python Dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas scipy

    # 4. Run Python Tests
    - name: Run Python Tests
      run: |
        # Assuming you have tests in a 'tests' folder
        # pytest 02-Programming-Languages/Python

    # 5. Set up C++ Compiler
    - name: Install GTest and CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtest-dev cmake
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib

    # 6. Build C++ Project
    - name: Build C++
      run: |
        mkdir -p build
        cd build
