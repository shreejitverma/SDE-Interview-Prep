# Example GitHub Actions CI workflow for building and testing C++ and Python projects.
name: CI Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install C++ dependencies and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev

      - name: Configure C++ project with CMake and Ninja
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ project
        run: cmake --build build

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run Python tests with pytest
        run: uv run --with pytest pytest
